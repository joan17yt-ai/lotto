name: LottoAnalytics Cloud Engine (Alertas y Auto-Actualizacion)

on:
  schedule:
    # 23:30 UTC = 6:30 PM Colombia (Recordatorio de sorteo)
    - cron: '30 23 * * *'
    # 04:30 UTC = 11:30 PM Colombia (Sorteo nocturno)
    - cron: '30 4 * * *'
    # 05:30 UTC = 12:30 AM Colombia (Revisión diferida +1h)
    - cron: '30 5 * * *'
  workflow_dispatch: # Botón para probar el envío manual cuando quieras

jobs:
  run-lotto:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clonar Repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Dependencias
        run: |
          pip install beautifulsoup4 numpy

      - name: Actualizar Sorteos
        run: |
          python scripts/update_data.py || true

      - name: Guardar Nuevos Sorteos en Netlify
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lottery_data.json
          if git diff --staged --quiet; then
            echo "No hay sorteos nuevos pendientes de guardar."
          else
            git commit -m "Auto-update: Nuevos sorteos oficiales [$(date -u)]"
            git push
          fi

      - name: Enviar Alerta Oficial a Telegram desde la Nube
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/send_telegram_alert.py --type reminder_630pm || python -c "
          import os, urllib.request, urllib.parse, json
          token = os.environ.get('TELEGRAM_BOT_TOKEN', '')
          chat_id = os.environ.get('TELEGRAM_CHAT_ID', '')
          data = json.load(open('data/lottery_data.json')) if os.path.exists('data/lottery_data.json') else {}
          b_jp = data.get('games', {}).get('baloto', {}).get('latest_draw', {}).get('jackpot', '\$61.600 Millones')
          m_jp = data.get('games', {}).get('miloto', {}).get('latest_draw', {}).get('jackpot', '\$260 Millones')
          msg = f'🔔 *¡RECORDATORIO DE SORTEO HOY!* 🇨🇴\n\nEsta noche juegan Baloto y MiLoto.\n💰 *Acumulado Baloto:* {b_jp}\n💰 *Acumulado MiLoto:* {m_jp}\n\n👉 *Página web en vivo:* https://lotto-colombia.netlify.app\n\nNo olvides ingresar a la página y buscar tus números optimizados para hoy. 🍀'
          url = f'https://api.telegram.org/bot{token}/sendMessage'
          payload = urllib.parse.urlencode({'chat_id': chat_id, 'text': msg, 'parse_mode': 'Markdown'}).encode()
          urllib.request.urlopen(urllib.request.Request(url, data=payload))
          "
