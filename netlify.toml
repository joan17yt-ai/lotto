# Netlify Configuration for LottoAnalytics Pro Colombia

[build]
  publish = "."

# Custom headers for SEO, performance, and security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Prevent aggressive caching on the data file so users always get fresh draws
[[headers]]
  for = "/data/lottery_data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
